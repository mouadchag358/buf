name: Facebook bilingual lessons
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: buffer-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: 6a9dd40e7a5c57f938ac3176
      BUFFER_FACEBOOK_CHANNEL_ID: 6ab674f7ea19ca0bdee54b05
      BUFFER_CHANNEL_IDS: 6ab674f7ea19ca0bdee54b05
      PUBLIC_MEDIA_REPOSITORY: ${{ github.repository }}
      PUBLIC_MEDIA_REF: main
      TIME_ZONE: Africa/Casablanca
      BUFFER_MAX_ATTEMPTS: 10
      BUFFER_MAX_SCHEDULED: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate the 100 course images
        run: |
          python -m pip install Pillow
          python generate-courses.py
      - name: Save images and lesson queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json images/cours
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate bilingual Facebook courses"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Install dependencies
        run: npm ci
      - name: Sync Facebook Buffer queue
        id: buffer_sync
        run: npm run buffer:sync
      - name: Save Buffer delivery state
        if: ${{ always() && steps.buffer_sync.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- posts.json; then exit 0; fi
          git add posts.json
          git commit -m "chore: save Facebook Buffer queue state"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
