name: Synchroniser Buffer

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: buffer-sync
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run_sync: ${{ steps.interval.outputs.run_sync }}
    steps:
      - name: Vérifier l'intervalle de dix heures
        id: interval
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Repère fixe UTC : conserve dix heures entre créneaux, même à minuit.
          anchor=$(date -u -d '2026-10-02T00:00:00Z' +%s)
          elapsed_hours=$(( ($(date -u +%s) - anchor) / 3600 ))
          if (( elapsed_hours >= 0 && elapsed_hours % 10 == 0 )); then
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_sync=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: cadence
    if: ${{ needs.cadence.outputs.run_sync == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: 6a9dd40e7a5c57f938ac3176
      BUFFER_FACEBOOK_CHANNEL_ID: 6ab674f7ea19ca0bdee54b05
      BUFFER_INSTAGRAM_CHANNEL_ID: 6ab6749aea19ca0bdee546fa

      PUBLIC_MEDIA_REPOSITORY: ${{ github.repository }}
      PUBLIC_MEDIA_REF: ${{ github.ref_name }}

      TIME_ZONE: Africa/Casablanca
      BUFFER_MAX_ATTEMPTS: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester
        run: npm test

      - name: Synchroniser vers Buffer
        id: buffer_sync
        run: npm run buffer:sync

      - name: Enregistrer l'état Buffer
        if: ${{ always() && steps.buffer_sync.outcome != 'skipped' }}
        shell: bash
        run: |
          if git diff --quiet -- posts.json; then
            echo "Aucune modification à enregistrer"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json
          git commit -m "chore: persist Buffer sync state"

          git pull --rebase
          git push
